[project]
name = "pramaan"
version = "1.0.0"
description = "Python SDK for the Pramaan registry API: verify certificates, search verified people, receive signed webhooks."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pramaan*"]
