# CI skeleton (spec OPS-08 / 14.3). Stages that exist today; later phases add axe, Lighthouse, visual regression,
# Schemathesis, SAST and the eval gate as those pieces land.
name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: pramaan, POSTGRES_PASSWORD: pramaan, POSTGRES_DB: pramaan }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pramaan" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install ".[dev]"
      - name: Static checks (real errors only; stricter rules arrive with the cleanup of existing code)
        run: ruff check app tests evals scripts --select E9,F63,F7,F82
      - name: Tests (mock LLM, real Postgres + Redis)
        run: pytest -q
      - name: Migrations apply to an empty database twice
        env:
          DATABASE_URL: postgresql+asyncpg://pramaan:pramaan@localhost:5432/pramaan_migcheck
        run: |
          python -c "import asyncio,asyncpg;
          async def m():
              c=await asyncpg.connect('postgresql://pramaan:pramaan@localhost:5432/postgres'); await c.execute('CREATE DATABASE pramaan_migcheck'); await c.close()
          asyncio.run(m())"
          alembic upgrade head && alembic upgrade head
      - name: "Evals (offline mock - checks the plumbing and the deterministic guards, not model quality)"
        run: python -m evals.run

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint # includes the design-token contrast gate (packages/ui)
      - name: Sector colours in TypeScript match tokens.css
        run: node packages/ui/scripts/gen-sectors.mjs && git diff --exit-code packages/ui/src/sectors.ts
      - run: pnpm typecheck
      - run: pnpm --filter web build

  sdk-fresh:
    # API-06: the SDK types are generated from the API itself; a stale copy fails here instead of surprising a developer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install "./backend[dev]"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate OpenAPI and the TypeScript types
        run: |
          python backend/scripts/dump_openapi.py packages/sdk/openapi.json
          pnpm --filter @pramaan/sdk generate
      - name: The committed copies are current
        run: git diff --exit-code packages/sdk
      - run: pnpm --filter @pramaan/sdk typecheck

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      # The offline verifier is pure Node and checked against certificates signed by the Python backend. The
      # Electron-window tests need a display and run in desktop-release.yml on Windows.
      - run: node scripts/test-verify.mjs

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: "Backend image (lite, no embedding model baked in)"
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          build-args: WITH_EMBEDDINGS=false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: "Web image (build context is the repo root, pnpm workspace)"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
