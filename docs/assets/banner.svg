<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Pramaan: Don't claim it. Prove it.</title>
  <desc id="d">India's verified registry of achievers. A marigold certificate seal with a check mark on a dark blue background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14152B"/>
      <stop offset="1" stop-color="#232552"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.80" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#FFB81C" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFB81C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FFB81C"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinback { to { transform: rotate(-360deg); } }
      @keyframes draw { from { stroke-dashoffset: 190; } to { stroke-dashoffset: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .spin { animation: spin 120s linear infinite; }
      .spinback { animation: spinback 70s linear infinite; }
      .tick { stroke-dasharray: 190; animation: draw 1.3s .5s cubic-bezier(.2,.8,.2,1) both; }
      .r1 { animation: rise .8s .1s ease-out both; }
      .r2 { animation: rise .8s .3s ease-out both; }
      .r3 { animation: rise .8s .5s ease-out both; }
      .r4 { animation: rise .8s .7s ease-out both; }
      .dot { animation: pulse 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>

  <!-- guilloche: the fine line work printed on real certificates -->
  <g transform="translate(1030 210)" fill="none" stroke="#FFB81C">
    <g class="spin" stroke-opacity=".20" stroke-width="1.2">
      <ellipse rx="230" ry="62"/><ellipse rx="230" ry="62" transform="rotate(15)"/><ellipse rx="230" ry="62" transform="rotate(30)"/>
      <ellipse rx="230" ry="62" transform="rotate(45)"/><ellipse rx="230" ry="62" transform="rotate(60)"/><ellipse rx="230" ry="62" transform="rotate(75)"/>
      <ellipse rx="230" ry="62" transform="rotate(90)"/><ellipse rx="230" ry="62" transform="rotate(105)"/><ellipse rx="230" ry="62" transform="rotate(120)"/>
      <ellipse rx="230" ry="62" transform="rotate(135)"/><ellipse rx="230" ry="62" transform="rotate(150)"/><ellipse rx="230" ry="62" transform="rotate(165)"/>
    </g>
    <g class="spinback" stroke-opacity=".16" stroke-width="1">
      <circle r="150"/><circle r="170"/><circle r="190"/><circle r="210"/><circle r="230"/>
    </g>
  </g>

  <!-- the seal -->
  <g transform="translate(1030 210)">
    <circle r="132" fill="url(#gold)"/>
    <g class="spin" style="animation-duration:40s">
      <circle r="118" fill="none" stroke="#14152B" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round"/>
    </g>
    <circle r="96" fill="none" stroke="#14152B" stroke-opacity=".35" stroke-width="2"/>
    <path class="tick" d="M-52 6 L-14 46 L58 -42" fill="none" stroke="#14152B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- a small QR-style block: every certificate carries one -->
  <g transform="translate(1176 318)" fill="#FFB81C" opacity=".85">
    <rect width="14" height="14"/><rect x="21" width="14" height="14"/><rect x="42" y="0" width="14" height="14" opacity=".4"/>
    <rect y="21" width="14" height="14" opacity=".4"/><rect x="21" y="21" width="14" height="14"/><rect x="42" y="21" width="14" height="14"/>
    <rect y="42" width="14" height="14"/><rect x="21" y="42" width="14" height="14" opacity=".4"/><rect x="42" y="42" width="14" height="14"/>
  </g>

  <!-- words -->
  <g class="r1">
    <rect x="64" y="58" rx="19" width="350" height="38" fill="none" stroke="#FFB81C" stroke-width="2"/>
    <circle class="dot" cx="86" cy="77" r="6" fill="#FFB81C"/>
    <text x="102" y="84" font-size="19" font-weight="600" fill="#FFB81C">India's verified registry of achievers</text>
  </g>
  <g class="r2">
    <text x="60" y="226" font-size="132" font-weight="800" fill="#FFFFFF" letter-spacing="-4">Pramaan</text>
  </g>
  <g class="r3">
    <text x="66" y="286" font-size="44" font-weight="700" fill="#FFB81C">Don't claim it. Prove it.</text>
  </g>
  <g class="r4">
    <text x="66" y="338" font-size="23" fill="#FFFFFF" fill-opacity=".78">Chat to get listed. Get a signed certificate with a QR code.</text>
    <text x="66" y="370" font-size="23" fill="#FFFFFF" fill-opacity=".78">Anyone can check it in seconds, without trusting us.</text>
  </g>
</svg>
