<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 350" width="1280" height="350" role="img" aria-labelledby="t d">
  <title id="t">From a chat to a certificate anyone can check</title>
  <desc id="d">Four steps: talk, prove, seal, check. A person decides anything doubtful.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .card { fill: #14152B; }
      .num { fill: #FFB81C; font-size: 15px; font-weight: 700; }
      .h { fill: #FFFFFF; font-size: 30px; font-weight: 800; }
      .p { fill: #FFFFFF; fill-opacity: .78; font-size: 17px; }
      .ico { fill: none; stroke: #FFB81C; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: none; stroke: #FFB81C; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .arrow { stroke-dasharray: 8 6; animation: flow 1.4s linear infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- cards -->
  <g>
    <rect class="card" x="8" y="20" width="286" height="250" rx="22"/>
    <rect class="card" x="332" y="20" width="286" height="250" rx="22"/>
    <rect class="card" x="656" y="20" width="286" height="250" rx="22"/>
    <rect class="card" x="980" y="20" width="286" height="250" rx="22"/>
  </g>

  <!-- arrows -->
  <path class="arrow" d="M300 135 H326"/><path class="arrow" d="M624 135 H650"/><path class="arrow" d="M948 135 H974"/>

  <!-- 1 talk -->
  <text class="num" x="36" y="62">1</text>
  <g transform="translate(0 -22)">
  <path class="ico" d="M40 96 h92 a14 14 0 0 1 14 14 v36 a14 14 0 0 1 -14 14 h-52 l-24 20 v-20 h-16 a14 14 0 0 1 -14 -14 v-36 a14 14 0 0 1 14 -14z"/>
  <path class="ico" d="M64 128 h44 M64 144 h28" />
  </g>
  <text class="h" x="36" y="226">Talk</text>
  <text class="p" x="36" y="252">A chat, not a form.</text>

  <!-- 2 prove -->
  <text class="num" x="360" y="62">2</text>
  <g transform="translate(0 -22)">
  <path class="ico" d="M368 92 h56 l22 22 v68 a8 8 0 0 1 -8 8 h-70 a8 8 0 0 1 -8 -8 v-82 a8 8 0 0 1 8 -8z M424 92 v22 h22"/>
  <circle class="ico" cx="432" cy="160" r="20"/><path class="ico" d="M446 174 l22 22"/>
  </g>
  <text class="h" x="360" y="226">Prove</text>
  <text class="p" x="360" y="252">Evidence for every achievement.</text>

  <!-- 3 seal -->
  <text class="num" x="684" y="62">3</text>
  <g transform="translate(0 -22)">
  <circle class="ico" cx="738" cy="132" r="42"/>
  <path class="ico" d="M718 134 l14 14 l28 -32"/>
  <path class="ico" d="M716 170 l-10 34 l32 -14 l32 14 l-10 -34"/>
  </g>
  <text class="h" x="684" y="226">Seal</text>
  <text class="p" x="684" y="252">Signed. Written to a public log.</text>

  <!-- 4 check -->
  <text class="num" x="1008" y="62">4</text>
  <g transform="translate(0 -22)">
  <rect class="ico" x="1020" y="92" width="38" height="38" rx="6"/><rect class="ico" x="1070" y="92" width="38" height="38" rx="6"/>
  <rect class="ico" x="1020" y="142" width="38" height="38" rx="6"/>
  <path class="ico" d="M1072 150 h12 v12 M1072 176 h8 M1096 146 v36 M1108 164 h-12"/>
  </g>
  <text class="h" x="1008" y="226">Check</text>
  <text class="p" x="1008" y="252">Scan it. Anyone, anywhere.</text>

  <!-- the human gate -->
  <g>
    <path d="M475 270 v22" fill="none" stroke="#FFB81C" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/>
    <rect x="232" y="296" width="486" height="42" rx="21" fill="#FFB81C"/>
    <text x="475" y="323" text-anchor="middle" font-size="18" font-weight="700" fill="#14152B">Doubtful, or any error? A person decides. Never the AI.</text>
  </g>
</svg>
