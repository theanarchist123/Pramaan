[project]
name = "pramaan-backend"
version = "0.1.0"
description = "Pramaan — AI-native Who's Who India registry (API + agents)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "segno>=1.6",
  "pyjwt>=2.8",
  "anthropic>=1.0",
  "google-genai>=1.0",
  "langgraph>=0.2",
  "pillow>=10.0",
  "playwright>=1.48",
  "redis>=5",
  "procrastinate>=3",
  "psycopg[binary,pool]>=3.2",
  "langgraph-checkpoint-postgres>=2",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi",
  # Semantic search: a default dependency now. The app refuses to start in production if it silently falls back to
  # the lexical hash (set EMBEDDINGS=hash to choose that deliberately, e.g. on a very small host).
  "fastembed>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "fakeredis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
